plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.almalence.eye_tracking_calibration'
    compileSdk 34

    defaultConfig {
        applicationId "com.almalence.eye_tracking_calibration"
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
            defaultConfig {
                externalNativeBuild {
                    cmake {
                        arguments "-G Ninja" // Use Ninja generator
                    }
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildFeatures {
        viewBinding true
    }
}
